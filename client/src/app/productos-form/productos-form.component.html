<h2>
  {{
    esEdicion()
      ? esInsumo
        ? "Editar insumo"
        : "Editar producto"
      : esInsumo
        ? "Nuevo insumo"
        : "Nuevo producto"
  }}
</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div class="grid">
    <label>
      Tipo de registro
      <select formControlName="tipo">
        <option value="producto">🍦 Producto de venta</option>
        <option value="insumo">📦 Insumo / Materia prima</option>
      </select>
    </label>

    <label>
      Nombre
      <input
        formControlName="nombre"
        [placeholder]="
          esInsumo ? 'Ej: Pan de papa / Pote 1/4kg' : 'Ej: Super Dulce de Leche'
        "
      />

      <small
        class="error-msg"
        *ngIf="
          form.get('nombre')?.touched &&
          form.get('nombre')?.hasError('required')
        "
      >
        El nombre es obligatorio.
      </small>
      <small
        class="error-msg"
        *ngIf="
          form.get('nombre')?.touched &&
          form.get('nombre')?.hasError('minlength')
        "
      >
        Mínimo 2 caracteres.
      </small>
    </label>

    <label>
      Categoría
      <select formControlName="categoria">
        <optgroup label="Productos de venta" *ngIf="!esInsumo">
          <option value="helado">Helado</option>
          <option value="comida">Comida</option>
          <option value="bebida">Bebida</option>
        </optgroup>
        <optgroup label="Insumos internos" *ngIf="esInsumo">
          <option value="materia_prima">Materia prima (pan, carne, etc.)</option>
          <option value="descartable">Descartable (potes, bolsas, etc.)</option>
        </optgroup>
      </select>
    </label>

    <label>
      Unidad
      <select formControlName="unidad">
        <option value="kg">kg</option>
        <option value="unidad">unidad</option>
        <option value="litro">litro</option>
      </select>
    </label>

    <!-- Precios de venta: SOLO visibles si es un Producto -->
    <label *ngIf="!esInsumo">
      Precio venta
      <input
        type="number"
        formControlName="precioVenta"
        min="0"
        placeholder="0"
      />

      <small
        class="error-msg"
        *ngIf="
          form.get('precioVenta')?.touched &&
          form.get('precioVenta')?.hasError('required')
        "
      >
        Ingresá el precio de venta.
      </small>
      <small class="error-msg" *ngIf="form.get('precioVenta')?.hasError('min')">
        No puede ser negativo.
      </small>
    </label>

    <label *ngIf="!esInsumo">
      Precio Point
      <input
        type="number"
        formControlName="precioPoint"
        min="0"
        placeholder="Opcional"
      />

      <small class="hint">
        Si queda vacío, se usa el precio de venta normal.
      </small>

      <small class="error-msg" *ngIf="form.get('precioPoint')?.hasError('min')">
        No puede ser negativo.
      </small>
    </label>

    <label>
      Costo {{ esInsumo ? "(por unidad/kg)" : "" }}
      <input type="number" formControlName="costo" min="0" placeholder="0" />

      <small class="error-msg" *ngIf="form.get('costo')?.hasError('min')">
        El costo no puede ser negativo.
      </small>
    </label>

    <label>
      Stock actual
      <input
        type="number"
        formControlName="stockActual"
        min="0"
        step="any"
        placeholder="0"
      />

      <small
        class="error-msg"
        *ngIf="
          form.get('stockActual')?.touched &&
          form.get('stockActual')?.hasError('required')
        "
      >
        Requerido.
      </small>
      <small class="error-msg" *ngIf="form.get('stockActual')?.hasError('min')">
        Mínimo 0.
      </small>
    </label>

    <label>
      Stock mínimo
      <input
        type="number"
        formControlName="stockMinimo"
        min="0"
        step="any"
        placeholder="0"
      />

      <small
        class="error-msg"
        *ngIf="
          form.get('stockMinimo')?.touched &&
          form.get('stockMinimo')?.hasError('required')
        "
      >
        Requerido.
      </small>
      <small class="error-msg" *ngIf="form.get('stockMinimo')?.hasError('min')">
        Mínimo 0.
      </small>
    </label>
  </div>

  <!-- Sección de receta/descuento: SOLO visible si es un Producto -->
  <section class="stock-section" *ngIf="!esInsumo">
    <div class="section-head">
      <div>
        <h3>Insumos descontados</h3>
        <p>Usalo para productos como hamburguesas o potes. Ej: descuenta pan y medallón.</p>
      </div>

      <button type="button" class="btn-add" (click)="agregarInsumo()">
        + Agregar insumo
      </button>
    </div>

    <div
      class="insumo-row"
      *ngFor="let item of descuentaStock.controls; let i = index"
      [formGroup]="$any(item)"
    >
      <label>
        Insumo a descontar
        <select formControlName="productoId">
          <option value="">Seleccionar insumo</option>
          <option *ngFor="let p of productosInsumos" [value]="p._id">
            {{ p.nombre }} ({{ p.unidad }})
          </option>
        </select>
      </label>

      <label>
        Cantidad
        <input
          type="number"
          min="0.001"
          step="any"
          formControlName="cantidad"
        />
      </label>

      <button type="button" class="btn-remove" (click)="quitarInsumo(i)">
        Quitar
      </button>
    </div>

    <div class="empty-insumos" *ngIf="descuentaStock.length === 0">
      Este producto descuenta su propio stock directamente.
    </div>
  </section>

  <div class="actions">
    <button type="button" (click)="volver()">Cancelar</button>
    <button type="submit" [disabled]="form.invalid">Guardar</button>
  </div>
</form>

<pre *ngIf="debug">{{ form.value | json }}</pre>
